name: Bug report
description: Report a reproducible problem using synthetic, non-sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This is a non-official community plugin. **Do not include real rules, résumés, papers, session logs, credentials, tokens, profile dumps, private paths, or proprietary text.** Replace them with a minimal synthetic reproduction. Report security issues privately as described in SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: dsh-claim-guard version
      placeholder: 0.1.0 plus release asset checksum
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.1-rc.2 and commit/tag if known
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js and pnpm versions
      placeholder: Node 24.15.0; pnpm 11.7.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.x or Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Disposable profile name and plugin state
      description: Give only a synthetic profile name and say whether the row is enabled. Do not paste a full profile dump.
      placeholder: claim-guard-smoke; enabled
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include minimal synthetic rules, tool name, sanitized arguments, and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Remove usernames, absolute paths, credentials, session data, and private text.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only synthetic data and removed credentials, tokens, private paths, session logs, and personal information.
          required: true
        - label: I checked the documented tool/workspace bypasses and this report is not one of those expected limitations.
          required: true
