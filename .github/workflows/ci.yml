name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.15.0
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: ""
      - name: Freeze npm and pnpm
        shell: bash
        run: |
          npm install --global npm@11.12.1
          test "$(npm --version)" = "11.12.1"
          corepack prepare pnpm@11.7.0 --activate
          corepack enable pnpm
          test "$(pnpm --version)" = "11.7.0"
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Verify peers and complete test suite
        run: |
          pnpm peers check
          pnpm test
          pnpm benchmark

  release-artifact:
    name: One release candidate artifact
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js 24.15.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: ""
      - name: Freeze npm and pnpm
        shell: bash
        run: |
          npm install --global npm@11.12.1
          test "$(npm --version)" = "11.12.1"
          corepack prepare pnpm@11.7.0 --activate
          corepack enable pnpm
          test "$(pnpm --version)" = "11.7.0"
      - name: Install and audit production closure
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
          pnpm peers check
          pnpm audit --prod --audit-level high
      - name: Pack once from GITHUB_SHA
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          artifact_name="dsh-claim-guard-0.1.0.tgz"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$artifact_name"
          shasum -a 256 "$RUNNER_TEMP/release/$artifact_name" > "$RUNNER_TEMP/release/$artifact_name.sha256"
          shasum -a 256 -c "$RUNNER_TEMP/release/$artifact_name.sha256"
          node scripts/audit-release.mjs --tarball "$RUNNER_TEMP/release/$artifact_name" --commit "$GITHUB_SHA"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload the exact candidate pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release/${{ steps.pack.outputs.artifact_name }}
            ${{ runner.temp }}/release/${{ steps.pack.outputs.artifact_name }}.sha256
