name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.19.0
          - 24.15.0
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: ""
      - name: Freeze npm and pnpm
        shell: bash
        run: |
          npm install --global npm@11.12.1
          test "$(npm --version)" = "11.12.1"
          corepack prepare pnpm@11.7.0 --activate
          corepack enable pnpm
          test "$(pnpm --version)" = "11.7.0"
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
      - name: Verify peers and complete test suite
        run: |
          pnpm peers check
          pnpm test
          pnpm benchmark

  release-artifact:
    name: One release candidate artifact
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ""
      - name: Freeze npm and pnpm
        shell: bash
        run: |
          npm install --global npm@11.12.1
          test "$(npm --version)" = "11.12.1"
          corepack prepare pnpm@11.7.0 --activate
          corepack enable pnpm
          test "$(pnpm --version)" = "11.7.0"
      - name: Install and audit production closure
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts
          pnpm peers check
          pnpm audit --prod --audit-level high
      - name: Pack once from GITHUB_SHA
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          artifact_name="dsh-claim-guard-0.1.0.tgz"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$artifact_name"
          (
            cd "$RUNNER_TEMP/release"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
            shasum -a 256 -c "$artifact_name.sha256"
          )
          node scripts/audit-release.mjs --tarball "$RUNNER_TEMP/release/$artifact_name" --commit "$GITHUB_SHA"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Upload the exact candidate pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/release/${{ steps.pack.outputs.artifact_name }}
            ${{ runner.temp }}/release/${{ steps.pack.outputs.artifact_name }}.sha256
